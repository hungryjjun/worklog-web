<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <div class="page-header">
      <h1 class="page-title">공지사항</h1>
      <button type="button" id="noticeCreateOpenButton" class="button button-primary">등록</button>
    </div>

    <!-- 검색 버튼 클릭과 검색어 입력칸 Enter를 submit 하나로 처리합니다. 안내 문구를 직접 보여주려고 기본 검증은 끕니다. -->
    <form id="noticeSearchForm" class="search-form" novalidate>
      <label for="noticeSearchCategory" class="visually-hidden">구분</label>
      <select id="noticeSearchCategory" class="form-control">
        <option value="">전체</option>
      </select>

      <label for="noticeSearchType" class="visually-hidden">검색대상</label>
      <select id="noticeSearchType" class="form-control"></select>

      <label for="noticeSearchKeyword" class="visually-hidden">검색어</label>
      <input type="search" id="noticeSearchKeyword" class="form-control search-keyword"
             maxlength="20" placeholder="검색어">

      <span class="search-period">
        <label for="noticeSearchFrom" class="visually-hidden">시작일</label>
        <!-- max가 없으면 크롬에서 연도를 6자리까지 입력할 수 있습니다. -->
        <input type="date" id="noticeSearchFrom" class="form-control" max="9999-12-31">
        <span aria-hidden="true">~</span>
        <label for="noticeSearchTo" class="visually-hidden">종료일</label>
        <input type="date" id="noticeSearchTo" class="form-control" max="9999-12-31">
      </span>

      <button type="submit" class="button button-primary">검색</button>
      <button type="button" id="noticeSearchResetButton" class="button">초기화</button>
    </form>
    <p id="noticeSearchError" class="form-error search-error" role="alert" hidden></p>

    <!-- AI가 질문에서 검색 조건을 뽑아 위 검색창에 채운 뒤 일반 검색을 실행합니다. -->
    <form id="noticeAiSearchForm" class="search-form" novalidate>
      <span class="ai-search-icon" aria-hidden="true">🤖</span>
      <label for="noticeAiQuestion" class="visually-hidden">AI에게 찾을 공지 질문</label>
      <input type="text" id="noticeAiQuestion" class="form-control search-keyword"
             maxlength="200" placeholder="예: 올해 인사 공지 중 휴가 관련 글 찾아줘">
      <button type="submit" id="noticeAiSearchButton" class="button">AI로 찾기</button>
    </form>
    <!-- "이렇게 이해했어요"와 오류 안내를 함께 씁니다. aria-live로 스크린리더가 바뀐 문구를 읽습니다. -->
    <p id="noticeAiSearchMessage" class="ai-search-message" aria-live="polite" hidden></p>

    <div class="list-toolbar">
      <p id="noticeRangeText" class="list-range" hidden></p>
      <label id="noticePageSizeLabel" class="list-page-size" hidden>
        <span class="visually-hidden">페이지당 건수</span>
        <select id="noticePageSizeSelect" class="form-control">
          <option value="20">20개씩</option>
          <option value="50">50개씩</option>
          <option value="100">100개씩</option>
        </select>
      </label>
    </div>

    <!-- 불러오는 중, 0건, 없는 페이지, 오류일 때 표 대신 보여줍니다. -->
    <div id="noticeListMessage" class="list-message">
      <p id="noticeListMessageText">불러오는 중입니다...</p>
      <button type="button" id="noticeFirstPageButton" class="button" hidden>첫 페이지로</button>
    </div>

    <div id="noticeTableWrap" class="table-wrap" hidden>
      <table class="table">
        <thead>
          <tr>
            <th scope="col">번호</th>
            <th scope="col">구분</th>
            <th scope="col" class="col-title">제목</th>
            <th scope="col">작성자 사번</th>
            <th scope="col">작성일</th>
            <th scope="col">조회수</th>
          </tr>
        </thead>
        <tbody id="noticeTableBody"></tbody>
      </table>
    </div>

    <div class="list-footer">
      <nav id="noticePagination" class="pagination" aria-label="페이지" hidden></nav>
      <p id="noticePageText" class="list-page-text" hidden></p>
    </div>
  </main>

  <dialog id="noticeCreateDialog" class="modal" aria-labelledby="noticeCreateHeading">
    <!-- 필수 항목 안내 문구를 직접 표시하려고 브라우저 기본 검증을 끕니다. -->
    <form id="noticeCreateForm" novalidate>
      <div class="modal-header">
        <h2 id="noticeCreateHeading" class="modal-title">공지사항 등록</h2>
        <div class="modal-actions">
          <button type="submit" id="noticeSaveButton" class="button button-primary">저장</button>
          <button type="button" id="noticeCancelButton" class="button">취소</button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-row-item">
          <span class="form-row-label">등록일시</span>
          <span id="noticeCreateDateText"></span>
        </div>
        <div class="form-row-item">
          <span class="form-row-label">등록자</span>
          <span id="noticeCreateEmpNoText"></span>
        </div>
        <div class="form-row-item">
          <label for="noticeCategoryInput" class="form-row-label">구분</label>
          <select id="noticeCategoryInput" class="form-control">
            <option value="">선택하세요</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label for="noticeTitleInput">제목</label>
        <input type="text" id="noticeTitleInput" class="form-control">
      </div>

      <div class="form-field">
        <label for="noticeContentInput">내용</label>
        <textarea id="noticeContentInput" class="form-control" rows="10"></textarea>
      </div>

      <p id="noticeFormError" class="form-error" role="alert" hidden></p>
    </form>
  </dialog>

  <!-- 순서 중요: 뒤의 파일이 앞 파일의 상수와 함수를 사용합니다. -->
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/notice-list.js"></script>
  <script src="js/notice-ai-search.js"></script>
  <script src="js/notice-create.js"></script>
</body>
</html>
