<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 상세</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <div class="page-header">
      <h1 class="page-title">공지사항</h1>
      <button type="button" id="closeButton" class="button">닫기</button>
    </div>

    <p id="noticeMessage" class="detail-message"></p>

    <article id="noticeDetail" class="detail" hidden>
      <dl class="detail-meta">
        <div>
          <dt>등록일 :</dt>
          <dd id="noticeCreateAt"></dd>
        </div>
        <div>
          <dt>구분 :</dt>
          <dd id="noticeCategory"></dd>
        </div>
        <div>
          <dt>작성자 :</dt>
          <dd id="noticeCreateEmpNo"></dd>
        </div>
        <div class="detail-meta-right">
          <dt>조회수 :</dt>
          <dd id="noticeViewCnt"></dd>
        </div>
      </dl>
      <div class="detail-title-row">
        <span class="detail-label">제목 :</span>
        <h2 id="noticeTitle" class="detail-title"></h2>
      </div>
      <div id="noticeContent" class="detail-content"></div>
      <div class="detail-files">
        <span class="detail-label">첨부파일</span>
        <!-- 첨부파일 API가 생기면 실제 목록으로 교체합니다. -->
        <p class="detail-files-empty">등록된 파일이 없습니다.</p>
      </div>
    </article>
  </main>

  <!-- 순서 중요: 뒤의 파일이 앞 파일의 상수와 함수를 사용합니다. -->
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/notice-detail.js"></script>
</body>
</html>
